# fly.toml app configuration file generated for smart-study-guides on 2026-06-27T06:13:16Z
app = 'smart-study-guides'
primary_region = 'iad'

[build]

[processes]
  app = "python flask_app/main.py"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
